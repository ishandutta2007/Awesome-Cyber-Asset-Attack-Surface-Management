<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#818cf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#c084fc" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radar Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Asset Node Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 25px; opacity: 0.8; }
      50% { r: 60px; opacity: 0.2; }
      100% { r: 95px; opacity: 0; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .radar-beam {
      transform-origin: 820px 140px;
      animation: rotateRadar 6s linear infinite;
    }
    .pulse-1 {
      animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .pulse-2 {
      animation: pulseRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.5s;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashFlow 2s linear infinite;
    }
    .active-node {
      animation: blink 2.5s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="280" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="240" x2="960" y2="240" />

    <line x1="60" y1="0" x2="60" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="260" y1="0" x2="260" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    <line x1="460" y1="0" x2="460" y2="280" />
    <line x1="560" y1="0" x2="560" y2="280" />
    <line x1="660" y1="0" x2="660" y2="280" />
    <line x1="760" y1="0" x2="760" y2="280" />
    <line x1="860" y1="0" x2="860" y2="280" />
  </g>

  <!-- Border Glow -->
  <rect width="958" height="278" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>

  <!-- Left Side: CAASM Connectivity & Asset Topology Graph -->
  <g opacity="0.85">
    <line x1="80" y1="80" x2="140" y2="150" stroke="#0ea5e9" stroke-width="1.5" class="flow-line"/>
    <line x1="140" y1="150" x2="90" y2="210" stroke="#6366f1" stroke-width="1.5" class="flow-line"/>
    <line x1="140" y1="150" x2="210" y2="130" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="210" y1="130" x2="180" y2="220" stroke="#a855f7" stroke-width="1.5" class="flow-line"/>
    <line x1="210" y1="130" x2="240" y2="70" stroke="#38bdf8" stroke-width="1.5"/>

    <circle cx="80" cy="80" r="8" fill="#0284c7" filter="url(#nodeGlow)" class="active-node"/>
    <circle cx="140" cy="150" r="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <circle cx="90" cy="210" r="7" fill="#6366f1" filter="url(#nodeGlow)"/>
    <circle cx="210" cy="130" r="10" fill="#7c3aed" filter="url(#glow)" class="active-node"/>
    <circle cx="180" cy="220" r="6" fill="#a855f7"/>
    <circle cx="240" cy="70" r="7" fill="#38bdf8" filter="url(#nodeGlow)"/>

    <circle cx="140" cy="150" r="4" fill="#ffffff" />
    <circle cx="210" cy="130" r="3" fill="#ffffff" />
  </g>

  <!-- Center Content: Typography & Badges -->
  <g transform="translate(290, 65)">
    <path d="M0 10 L18 2 L36 10 C36 28 18 38 18 38 C18 38 0 28 0 10 Z" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="4" fill="#38bdf8" class="active-node"/>

    <rect x="50" y="4" width="230" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="62" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">
      🛡️ ATTACK SURFACE MANAGEMENT
    </text>

    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5">
      Awesome CAASM
    </text>

    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Cyber Asset Attack Surface &amp; Exposure Management Ecosystem
    </text>

    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="105" height="22" rx="6" fill="#0369a1" opacity="0.3"/>
      <rect x="0" y="0" width="105" height="22" rx="6" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="10" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc">☁️ Cloud &amp; SaaS</text>

      <rect x="115" y="0" width="115" height="22" rx="6" fill="#4338ca" opacity="0.3"/>
      <rect x="115" y="0" width="115" height="22" rx="6" fill="none" stroke="#818cf8" stroke-width="0.8"/>
      <text x="125" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#c7d2fe">🔍 Asset Discovery</text>

      <rect x="240" y="0" width="115" height="22" rx="6" fill="#6b21a8" opacity="0.3"/>
      <rect x="240" y="0" width="115" height="22" rx="6" fill="none" stroke="#c084fc" stroke-width="0.8"/>
      <text x="250" y="15" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#e9d5ff">⚡ Exposure Graph</text>
    </g>
  </g>

  <!-- Right Side: Animated Cyber Radar Scan -->
  <g transform="translate(0, 0)">
    <circle cx="820" cy="140" r="30" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="820" cy="140" r="60" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="820" cy="140" r="95" fill="none" stroke="#334155" stroke-width="1.5"/>

    <circle cx="820" cy="140" r="25" fill="none" stroke="#0ea5e9" stroke-width="1.5" class="pulse-1"/>
    <circle cx="820" cy="140" r="25" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulse-2"/>

    <line x1="715" y1="140" x2="925" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="3, 3"/>
    <line x1="820" y1="35" x2="820" y2="245" stroke="#334155" stroke-width="1" stroke-dasharray="3, 3"/>

    <g class="radar-beam">
      <path d="M820 140 L915 140 A95 95 0 0 0 887 73 Z" fill="url(#titleGradient)" opacity="0.25"/>
      <line x1="820" y1="140" x2="915" y2="140" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    </g>

    <circle cx="850" cy="100" r="5" fill="#ef4444" filter="url(#nodeGlow)" class="active-node"/>
    <circle cx="780" cy="170" r="4.5" fill="#10b981" filter="url(#nodeGlow)"/>
    <circle cx="880" cy="165" r="4" fill="#f59e0b" filter="url(#nodeGlow)"/>
    <circle cx="800" cy="90" r="3.5" fill="#38bdf8"/>
    
    <circle cx="820" cy="140" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>
